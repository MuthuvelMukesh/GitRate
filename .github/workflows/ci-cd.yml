name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # CI-only credentials. The application refuses to start with these values when
  # ENVIRONMENT=production, which is asserted by the security test suite.
  SECRET_KEY: "ci-only-secret-key-not-for-production-use-0001"
  ENVIRONMENT: "test"
  DATABASE_URL: "postgresql+asyncpg://gitrate:test_password@localhost:5432/gitrate_test"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ------------------------------------------------------------------------------------
  # 1. Static analysis. pytest is the hard gate (job 2); the style/type/security scanners
  #    run as advisory gates until the legacy formatting baseline is adopted - see
  #    docs/IMPLEMENTATION_GAP_ANALYSIS.md (G-15). They never fail the build today, and
  #    that is stated explicitly instead of being hidden behind --exit-zero.
  # ------------------------------------------------------------------------------------
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit pip-audit
      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check gitrate --output-format=github
      - name: Black format check (advisory)
        continue-on-error: true
        run: black --check gitrate
      - name: MyPy type check (advisory)
        continue-on-error: true
        run: mypy gitrate --ignore-missing-imports
      - name: Bandit security scan (advisory)
        continue-on-error: true
        run: bandit -r gitrate -ll -f json -o bandit-report.json
      - name: Dependency audit (pip-audit, advisory)
        continue-on-error: true
        run: pip-audit --skip-editable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------------
  # 2. Test suite (hard gate). Offline except for the PostgreSQL/Redis service
  #    containers; the suite never requires GitHub access.
  # ------------------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gitrate
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gitrate_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio pytest-cov
      - name: Unit + integration tests with coverage
        run: |
          python -m pytest gitrate/tests -q \
            --cov=gitrate --cov-report=xml --cov-report=term-missing \
            -m "not performance"
      - name: Security test suite
        run: python -m pytest gitrate/tests/security -q -m security
      - name: End-to-end pipeline tests (offline)
        run: python -m pytest gitrate/tests/e2e -q -m e2e
      - name: Benchmark suite (synthetic repositories)
        run: python -m pytest gitrate/tests/performance -q -m benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore


  # ------------------------------------------------------------------------------------
  # 3. Migration tests: Alembic must build (and tear down) the schema from scratch on a
  #    real PostgreSQL instance. The previous pipeline never ran migrations at all.
  # ------------------------------------------------------------------------------------
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gitrate
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gitrate_migrations
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: "postgresql+asyncpg://gitrate:test_password@localhost:5432/gitrate_migrations"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade base
        run: alembic downgrade base

  # ------------------------------------------------------------------------------------
  # 4. Docker build + integration smoke test against the real entrypoint.
  # ------------------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t gitrate-backend:ci .
      - name: Start container and probe /health
        run: |
          docker run -d --name gitrate-backend-ci -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e SECRET_KEY=ci-only-secret-key-not-for-production-use-0001 \
            gitrate-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo "health OK"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
      - name: Container logs
        if: always()
        run: docker logs gitrate-backend-ci
      - name: Stop container
        if: always()
        run: docker rm -f gitrate-backend-ci


  # ------------------------------------------------------------------------------------
  # 5. Validation artifacts: benchmark + evaluation metrics are generated and stored so
  #    that performance/ML numbers can be reproduced from the build.
  # ------------------------------------------------------------------------------------
  validation-reports:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate benchmark repositories
        run: python -m benchmark.generate_repositories --out evaluation/benchmark_repositories
      - name: Run benchmark suite
        run: python -m benchmark.run_benchmarks --out benchmark/results
      - name: Run auditor evaluation (precision/recall/F1)
        run: python -m evaluation.evaluator --out evaluation/reports
      - name: Run load test (in-process ASGI, 10..500 concurrent)
        run: python -m benchmark.load_test --out benchmark/results
      - uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            benchmark/results
            evaluation/reports
          if-no-files-found: warning
