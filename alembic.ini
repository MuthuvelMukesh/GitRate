[alembic]
# Migration scripts live inside the package (moved from ./migrations).
script_location = gitrate/database/migrations
prepend_sys_path = .
version_path_separator = os

# The URL is intentionally blank here: gitrate/database/migrations/env.py reads
# DATABASE_URL from gitrate.utils.config.settings so that migrations always use the
# same configuration source as the application (no duplicated credentials).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
