global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: gitrate

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gitrate-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
