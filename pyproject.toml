[tool.poetry]
name = "gitrate-audit"
version = "1.0.0"
description = "Enterprise-grade Technical Due Diligence platform for M&A and VC investment audits"
authors = ["GitRate Team <team@gitrate.io>"]
readme = "README.md"
license = "MIT"
packages = [{include = "gitrate"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
gunicorn = "^21.2.0"
starlette = "^0.27.0"
python-multipart = "^0.0.6"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.12.0"
psycopg2-binary = "^2.9.0"

# Caching & Task Queue
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.3.0"}

# Data Validation & Serialization
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
marshmallow = "^3.20.0"

# AI/LLM Integration
langchain = "^0.1.0"
anthropic = "^0.7.0"
openai = "^1.3.0"
google-generativeai = "^0.3.0"
litellm = "^1.30.0"

# Embeddings & Vector Search
sentence-transformers = "^2.2.0"
faiss-cpu = "^1.7.4"

# GitHub Integration
PyGithub = "^2.1.1"
gitpython = "^3.1.40"

# Code Analysis
radon = "^6.1.0"
pylint = "^3.0.0"
bandit = "^1.7.5"
coverage = {extras = ["toml"], version = "^7.3.0"}
semgrep = "^1.45.0"

# Dependency Analysis
pip-audit = "^2.6.0"
safety = "^2.3.0"
pip-licenses = "^4.3.0"

# Secrets Detection
detect-secrets = "^1.4.0"

# CVE & Vulnerability
requests = "^2.31.0"

# Report Generation
weasyprint = "^60.0"
jinja2 = "^3.1.0"
python-pptx = "^0.6.21"

# Data Processing & Visualization
pandas = "^2.1.0"
numpy = "^1.26.0"
plotly = "^5.18.0"
matplotlib = "^3.8.0"

# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-env = "^1.1.0"
hypothesis = "^6.88.0"
faker = "^21.0.0"
httpx = "^0.25.0"

# Code Quality
black = "^23.12.0"
isort = "^5.13.0"
ruff = "^0.1.8"
mypy = "^1.7.0"

# Logging
loguru = "^0.7.0"

# Configuration
python-dotenv = "^1.0.0"
pyyaml = "^6.0.0"
toml = "^0.10.0"

# Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = "^2.8.0"

# Security
cryptography = "^41.0.0"
slowapi = "^0.1.9"

# Parsing & File Handling
lxml = "^4.9.0"
beautifulsoup4 = "^4.12.0"

# Utilities
click = "^8.1.0"
typer = "^0.9.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.0"
pre-commit = "^3.6.0"
ipython = "^8.18.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=gitrate --cov-report=html --cov-report=term-missing"
env = ["ENVIRONMENT=test"]

[tool.coverage.run]
source = ["gitrate"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
