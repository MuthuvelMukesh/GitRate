[pytest]
# Single source of truth for pytest configuration.
# NOTE: [tool.pytest.ini_options] in pyproject.toml was removed on purpose - two
# pytest configs is exactly the "conflicting source of truth" problem described in
# docs/IMPLEMENTATION_GAP_ANALYSIS.md.

testpaths = gitrate/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Markers (--strict-markers makes an unregistered marker a hard error)
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-focused tests (authn/authz/SSRF/webhook/replay/validation)
    e2e: End-to-end pipeline tests (offline, local git repositories)
    slow: Slow tests
    performance: Performance and load tests (measure real timings)
    benchmark: Benchmark-suite tests against synthetic repositories

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio mode (pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage options (when running with pytest-cov)
# run: pytest --cov=gitrate --cov-report=html

