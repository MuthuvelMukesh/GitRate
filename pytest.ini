[pytest]
# Pytest configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    async: Async tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio mode
asyncio_mode = auto

# Coverage options (when running with pytest-cov)
# run: pytest --cov=. --cov-report=html

# Timeout (if pytest-timeout installed)
# timeout = 300
